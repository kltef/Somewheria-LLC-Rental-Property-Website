# nginx reverse-proxy server block for the Somewheria web app.
#
#   nginx (TLS, static, edge)  ->  gunicorn 127.0.0.1:8000  ->  Flask
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/somewheria
#   sudo ln -s /etc/nginx/sites-available/somewheria /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace example.com with your domain and adjust the paths below.
# TLS certs: use certbot (Let's Encrypt) to populate the ssl_certificate lines.

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    # --- TLS (managed by certbot / Let's Encrypt) --------------------------
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Absolute path to the repo checkout on the server.
    set $app_root /opt/somewheria/Somewheria-LLC-Rental-Property-Website;

    # Must be >= Flask's MAX_CONTENT_LENGTH (16 MB) so ticket-photo and
    # signed-contract uploads aren't rejected by nginx before reaching Flask.
    client_max_body_size 16m;

    # --- Static assets served straight from disk ---------------------------
    # Offloads CSS/JS/images/PWA assets from gunicorn workers. Scoped to
    # /static ONLY. Do NOT add a location for private/contracts/ — signed
    # contract PDFs live outside static/ on purpose and must stay behind the
    # authenticated /contracts/<id>/download route in Flask.
    location /static/ {
        alias $app_root/static/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    # --- Everything else proxies to gunicorn -------------------------------
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Forward the real client + scheme so Flask's ProxyFix can expose the
        # true remote_addr and so secure-cookie / OAuth redirect logic sees
        # https. REQUIRES TRUSTED_PROXY_COUNT=1 in the app's environment.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Keep >= gunicorn's --timeout (120s) so a slow upstream AWS fan-out
        # on a cold property cache isn't 504'd by nginx mid-request.
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }
}
