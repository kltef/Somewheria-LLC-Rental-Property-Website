<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{{ title or 'Offline' }}</title>
  <meta name="theme-color" content="#f1f3ed">
  <style>
    :root {
      color-scheme: light dark;
      --sw-ink: #223a2c;
      --sw-ink-soft: #4a5c50;
      --sw-paper: #f1f3ed;
      --sw-card: #fbfcf9;
      --sw-brass: #c29a36;
      --sw-brass-ink: #8a6b1b;
      --sw-line: rgba(34, 58, 44, 0.32);
      --sw-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --sw-ink: #e4ebe0;
        --sw-ink-soft: #a7b4a7;
        --sw-paper: #121c15;
        --sw-card: #1a271d;
        --sw-brass: #d3ac4b;
        --sw-brass-ink: #d3ac4b;
        --sw-line: rgba(228, 235, 224, 0.30);
      }
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--sw-paper);
      color: var(--sw-ink);
      display: grid;
      min-height: 100vh;
      place-items: center;
    }
    .card {
      position: relative;
      max-width: 560px;
      width: 92%;
      box-sizing: border-box;
      background: var(--sw-card);
      border: 1px dashed var(--sw-line);
      border-radius: 2px;
      padding: 28px 24px;
      background-image:
        radial-gradient(circle at 7px 7px, var(--sw-brass) 2.2px, transparent 3px),
        radial-gradient(circle at calc(100% - 7px) 7px, var(--sw-brass) 2.2px, transparent 3px),
        radial-gradient(circle at 7px calc(100% - 7px), var(--sw-brass) 2.2px, transparent 3px),
        radial-gradient(circle at calc(100% - 7px) calc(100% - 7px), var(--sw-brass) 2.2px, transparent 3px);
      background-repeat: no-repeat;
    }
    .eyebrow {
      font-family: var(--sw-mono);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--sw-brass-ink);
      margin: 14px 0 0;
    }
    h1 { margin: 8px 0 0; font-size: 1.5rem; letter-spacing: -0.01em; }
    p { margin: 10px 0 0; line-height: 1.6; color: var(--sw-ink-soft); }
    .actions { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
    a.button, button.button {
      appearance: none;
      font: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      border: 1px solid var(--sw-ink);
      background: var(--sw-ink);
      color: var(--sw-paper);
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
    }
    button.button:focus-visible, a.button:focus-visible {
      outline: 2px dashed var(--sw-brass);
      outline-offset: 3px;
    }
    button.button.alt, a.button.alt {
      background: transparent;
      border-color: var(--sw-line);
      color: var(--sw-ink);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: inherit;
      text-decoration: none;
    }
    .brand img {
      width: 28px; height: 28px; border-radius: 6px; object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="card">
    <a class="brand" href="{{ url_for('home') }}">
      <img src="{{ url_for('static', filename='web_light_rd_SI@1x.png') }}" alt="Somewheria">
      <strong>Somewheria</strong>
    </a>
    <p class="eyebrow">No signal from the field</p>
    <h1>You're offline</h1>
    <p>Your device has lost its internet connection. Pages you've already visited are still readable. When you're back online, reload to get the latest content.</p>
    <div class="actions">
      <button class="button" onclick="location.reload()">Reload this page</button>
      <a class="button alt" href="{{ url_for('home') }}">Home</a>
      <a class="button alt" href="{{ url_for('for_rent') }}">For rent</a>
      <a class="button alt" href="{{ url_for('contact') }}">Contact</a>
    </div>
  </div>
</body>
</html>
